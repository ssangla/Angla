# ============================================================================
# Kubernetes ConfigMaps
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prompt-optimizer-config
  namespace: prompt-optimizer
data:
  NODE_ENV: "production"
  NLP_SERVICE_URL: "http://nlp-service:3001"
  DATA_SERVICE_URL: "http://data-service:3002"
  AUTH_SERVICE_URL: "http://auth-service:3003"
  INTEGRATION_SERVICE_URL: "http://integration-service:3004"
  CORS_ORIGIN: "https://prompt-optimizer.example.com"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: prompt-optimizer
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            proxy_pass http://gateway:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
