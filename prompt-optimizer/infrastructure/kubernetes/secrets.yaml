# ============================================================================
# Kubernetes Secrets (Template - DO NOT commit real secrets)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: prompt-optimizer-secrets
  namespace: prompt-optimizer
type: Opaque
stringData:
  # JWT Secret for authentication
  JWT_SECRET: "your-secure-jwt-secret-here"

  # Database credentials
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/prompt_optimizer"

  # Redis credentials
  REDIS_URL: "redis://redis:6379"

  # GitHub OAuth
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""

  # Google OAuth
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Notion OAuth
  NOTION_CLIENT_ID: ""
  NOTION_CLIENT_SECRET: ""
---
# TLS Secret for HTTPS (managed by cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: prompt-optimizer-tls
  namespace: prompt-optimizer
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key (placeholder)
  tls.crt: ""
  tls.key: ""
