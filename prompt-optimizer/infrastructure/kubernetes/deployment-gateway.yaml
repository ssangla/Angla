# ============================================================================
# API Gateway Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: prompt-optimizer
  labels:
    app: gateway
    app.kubernetes.io/name: prompt-optimizer
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: prompt-optimizer/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: prompt-optimizer-config
            - secretRef:
                name: prompt-optimizer-secrets
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: prompt-optimizer
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
